<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradebot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <strong>tradebot</strong>
  <span id="env" class="badge"></span>
  <span id="bal" class="muted"></span>
  <button id="logout" class="link">Log out</button>
</header>

<main class="trade">
  <section class="panel order">
    <div class="seg" id="market-kind">
      <button type="button" data-kind="futures" class="on">Futures</button>
      <button type="button" data-kind="spot">Spot</button>
    </div>

    <div class="coins" id="coins"></div>

    <label class="row">Amount <small class="muted" id="amount-hint">USDT margin</small></label>
    <div class="chips" id="amounts"></div>

    <div id="lev-row">
      <label class="row">Leverage</label>
      <div class="chips" id="levs"></div>
    </div>

    <details id="more">
      <summary>Limit price / TP / SL</summary>
      <div class="grid3">
        <label>Limit at <input id="price" inputmode="decimal" placeholder="market"></label>
        <label class="fut">TP <input id="tp" inputmode="decimal" placeholder="—"></label>
        <label class="fut">SL <input id="sl" inputmode="decimal" placeholder="—"></label>
      </div>
    </details>

    <div class="sides">
      <button type="button" id="long" class="long">Long</button>
      <button type="button" id="short" class="short">Short</button>
    </div>
    <!-- One confirm bar for both the panel and the text box -->
    <div id="confirm" class="confirm" hidden>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="yes">Place order <kbd>↵</kbd></button>
        <button id="no" class="secondary">Cancel <kbd>Esc</kbd></button>
        <span id="timer" class="muted"></span>
      </div>
    </div>
    <div id="result" class="result" hidden></div>

    <form id="quick" class="quick">
      <input id="text" placeholder="or type: long btc 100 5x tp 72k" autocomplete="off" spellcheck="false">
    </form>
  </section>

  <section class="panel">
    <h2>Positions <button class="link" id="refresh" title="Refresh">↻</button></h2>
    <div id="positions" class="muted">…</div>
    <h2 class="sub">Open orders</h2>
    <pre id="orders" class="muted">…</pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
